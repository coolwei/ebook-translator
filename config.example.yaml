project:
  name: ebook-translator
  output_dir: outputs
  jobs_dir: jobs

input:
  path: books/example.epub

translation:
  source_language: auto
  target_language: zh-TW
  bilingual_mode: original_above_translation
  preserve_html_tags: true
  preserve_footnotes: true
  skip_existing: true
  # segment = 一段一 request（預設）；segment_batch = 多段合併翻譯
  mode: segment
  segments_per_request: 1
  max_chars_per_request: 6000
  preserve_segment_order: true

provider:
  type: openai_compatible
  base_url: "https://your-openai-compatible-endpoint.example.com/v1"
  api_key_env: "TRANSLATION_API_KEY"
  model: "your-primary-model"
  # 當 primary 遇到 empty content / rate limit / quality_failed 時，依序切換。
  # 成功後會沿用該模型，不會每段都重置回 primary。
  fallback_models:
    - "your-fallback-model-1"
    - "your-fallback-model-2"
  timeout_seconds: 120

limits:
  rpm: 10
  concurrency: 1
  max_context_tokens: 32000
  max_output_tokens: 2000
  max_chars_per_chunk: 2000

resume:
  enabled: true
  checkpoint_every_segments: 1
  retry_failed: true
  max_retries: 3

logging:
  enabled: true
  level: info
  file: logs/translation.log
  per_book: true
  save_prompt: false
  save_response: true

quality:
  validate_empty_translation: true
  validate_untranslated_ratio: true
  validate_html_integrity: true
  max_length_ratio: 3.0
  validate_simplified_chinese: true
  validate_added_prefix: true
  validate_markdown_fence: true
  validate_explanation_prefix: true
  # 寬鬆模式（預設）：少量簡體字等只記 warning，不阻擋完成
  strict_mode: false
  hard_fail:
    - empty_content
    - markdown_fence
    - explanation_prefix
    - untranslated_text
  warning_only:
    - simplified_chinese
    - added_prefix
  simplified_chinese:
    max_error_chars: 3
    max_error_ratio: 0.01
    treat_as_warning_below_threshold: true

cli:
  language: zh-TW
  use_unicode_symbols: true

# 輸出樣式設定（可省略，省略時使用 simple 模式）
#
# bilingual_style 選項：
#   simple  — 原始雙語模式（.src / .trg 並列，預設）
#   note    — 中文筆記模式（原文淡化、譯文加寬行高，推薦）
#   compact — 緊湊模式（段落間距較小，適合長書）
output:
  bilingual_style: note
  show_source: true
  source_collapsible: false
  source_opacity: 0.55
  add_segment_id: false
  add_translation_label: true
